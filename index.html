<!DOCTYPE html>
<html>
<head>
    <title>Business App Login</title>
    <!-- Script para pigilan ang Back Button (GitHub Redirect issue) -->
    <script>
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };
    </script>
    
    <!-- Firebase SDK (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <h2>Login</h2>
    <button id="googleLoginBtn">Login with Gmail</button>
    <br><br>
    <a href="#" id="forgotPasswordLink">Forgot Password?</a>

    <script>
        // Firebase Configuration (Palitan ng iyong mismong config mula sa Firebase Console)
        const firebaseConfig = {
            apiKey: "ILAGAY_DITO",
            authDomain: "ILAGAY_DITO",
            projectId: "ILAGAY_DITO",
            storageBucket: "ILAGAY_DITO",
            messagingSenderId: "ILAGAY_DITO",
            appId: "ILAGAY_DITO"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Google Login
        document.getElementById('googleLoginBtn').addEventListener('click', function() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                // Pagka-login, pupunta sa nakatagong dashboard
                window.location.href = "dashboard.html";
            }).catch((error) => {
                alert("Login Failed: " + error.message);
            });
        });

        // Forgot Password
        document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
            e.preventDefault();
            const email = prompt("Ilagay ang iyong Gmail address para sa password reset:");
            if(email) {
                auth.sendPasswordResetEmail(email).then(() => {
                    alert("Naipadala na ang password reset link sa iyong email.");
                }).catch((error) => {
                    alert("Error: " + error.message);
                });
            }
        });
    </script>
</body>
</html>
