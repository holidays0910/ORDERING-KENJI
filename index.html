<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KusinaERP - Enterprise Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a;">

  <div class="card" style="max-width: 440px; width: 100%; margin: 1rem; padding: 2rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="color: #1e293b; font-size: 1.5rem;">🍳 KusinaERP Enterprise</h2>
      <p style="color: #64748b; font-size: 0.85rem;">Portal Login & Employee Access</p>
    </div>

    <!-- Login Form -->
    <div id="login-section">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="user@company.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" onclick="handleLogin()">Sign In</button>
      
      <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #64748b;">
        Wala pang account? <a href="#" style="color: #2563eb; font-weight: 600;" onclick="toggleAuthForm(true)">Mag-register dito</a>
      </p>
    </div>

    <!-- Self-Registration Form -->
    <div id="register-section" style="display: none;">
      <div class="form-group">
        <label>Buong Pangalan</label>
        <input type="text" id="reg-name" placeholder="Juan Dela Cruz" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email" placeholder="juan@company.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label>Requested Station / Branch</label>
        <input type="text" id="reg-station" placeholder="Hal: Branch Alabang o Commissary A" required>
      </div>
      <button class="btn btn-success" style="width: 100%; margin-top: 0.5rem;" onclick="handleRegister()">Submit Registration</button>
      
      <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #64748b;">
        May account na? <a href="#" style="color: #2563eb; font-weight: 600;" onclick="toggleAuthForm(false)">Bumalik sa Login</a>
      </p>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    function toggleAuthForm(showRegister) {
      document.getElementById('login-section').style.display = showRegister ? 'none' : 'block';
      document.getElementById('register-section').style.display = showRegister ? 'block' : 'none';
    }

    function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;

      let user = {
        email: email,
        name: email.split('@')[0],
        role: 'admin',
        branch: 'Head Office',
        status: 'active'
      };

      if (email.includes('branch')) {
        user.role = 'branch';
        user.branch = 'Branch ATC';
      } else if (email.includes('commissary_b') || email.includes('commi-b')) {
        user.role = 'commissary_b';
        user.branch = 'Commissary B (Vegetables & Wares)';
      } else if (email.includes('commissary') || email.includes('commi')) {
        user.role = 'commissary_a';
        user.branch = 'Commissary A (Meat & Finished Goods)';
      }

      setCurrentUser(user);
      if (user.role === 'admin') window.location.href = 'admin.html';
      else if (user.role.startsWith('commissary')) window.location.href = 'commissary.html';
      else window.location.href = 'branch.html';
    }

    function handleRegister() {
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      if (!name || !email) {
        alert('Mangyaring punan ang lahat ng field.');
        return;
      }
      alert('Narehistro na ang iyong account! Mangyaring maghintay habang ine-evaluate at ina-assign ni Admin ang iyong Branch o Role bago ka makapasok (Status: PENDING).');
      toggleAuthForm(false);
    }
  </script>
</body>
</html>
