<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KusinaERP - Enterprise Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a;">

  <div class="card" style="max-width: 440px; width: 100%; margin: 1rem; padding: 2rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="color: #1e293b; font-size: 1.5rem;">🍳 KusinaERP Enterprise</h2>
      <p style="color: #64748b; font-size: 0.85rem;">Secured Enterprise Portal (Firebase Auth & Firestore)</p>
    </div>

    <!-- Google Sign-In Button -->
    <button class="btn btn-google" style="width: 100%; margin-bottom: 1rem;" onclick="handleGoogleSignIn()">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
      </svg>
      Sign in with Google Account
    </button>

    <div class="divider">O GAMITIN ANG EMAIL AT PASSWORD</div>

    <!-- Email/Password Section -->
    <div id="login-section">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="user@company.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" onclick="handleEmailLogin()">Sign In with Email</button>
      
      <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #64748b;">
        Wala pang account? <a href="#" style="color: #2563eb; font-weight: 600;" onclick="toggleAuthForm(true)">Mag-register dito</a>
      </p>
    </div>

    <!-- Self-Registration Form -->
    <div id="register-section" style="display: none;">
      <div class="form-group">
        <label>Buong Pangalan</label>
        <input type="text" id="reg-name" placeholder="Juan Dela Cruz" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email" placeholder="juan@company.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label>Requested Station / Branch</label>
        <input type="text" id="reg-station" placeholder="Hal: Branch ATC o Commissary A" required>
      </div>
      <button class="btn btn-success" style="width: 100%; margin-top: 0.5rem;" onclick="handleRegister()">Submit Registration</button>
      
      <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #64748b;">
        May account na? <a href="#" style="color: #2563eb; font-weight: 600;" onclick="toggleAuthForm(false)">Bumalik sa Login</a>
      </p>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    function toggleAuthForm(showRegister) {
      document.getElementById('login-section').style.display = showRegister ? 'none' : 'block';
      document.getElementById('register-section').style.display = showRegister ? 'block' : 'none';
    }

    async function handleGoogleSignIn() {
      if (!auth || !googleProvider) {
        alert('Naka-offline o hindi pa nailalagay ang Firebase credentials sa firebase-config.js.');
        return;
      }
      try {
        const result = await auth.signInWithPopup(googleProvider);
        const fbUser = result.user;
        await processUserSession(fbUser.email, fbUser.displayName || fbUser.email, true);
      } catch (err) {
        console.error('Google Sign-In Error:', err);
        alert('Nabigo ang Google Login: ' + err.message);
      }
    }

    async function handleEmailLogin() {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;

      if (!email || !pass) {
        alert('Mangyaring i-type ang iyong email at password.');
        return;
      }

      if (auth && auth.signInWithEmailAndPassword && firebaseConfig.apiKey !== "AIzaSyYOUR_ACTUAL_FIREBASE_API_KEY") {
        try {
          const userCred = await auth.signInWithEmailAndPassword(email, pass);
          await processUserSession(userCred.user.email, userCred.user.displayName || email, false);
        } catch (err) {
          alert('Login Failed: ' + err.message);
        }
      } else {
        // Safe testing routing (No auto-admin unless explicitly admin)
        let role = 'branch';
        let branch = 'Branch ATC';
        let status = 'active';

        if (email.toLowerCase().includes('admin')) {
          role = 'admin';
          branch = 'Head Office';
        } else if (email.toLowerCase().includes('commissary_b') || email.toLowerCase().includes('commi-b')) {
          role = 'commissary_b';
          branch = 'Commissary B (Vegetables & Wares)';
        } else if (email.toLowerCase().includes('commissary') || email.toLowerCase().includes('commi')) {
          role = 'commissary_a';
          branch = 'Commissary A (Meat Division)';
        }

        const userObj = {
          email: email,
          name: email.split('@')[0],
          role: role,
          branch: branch,
          status: status,
          requiresPasswordSetup: false
        };
        setCurrentUser(userObj);
        redirectToRoleDashboard(role);
      }
    }

    async function processUserSession(email, displayName, fromGoogle) {
      if (db) {
        try {
          const docRef = db.collection('users').doc(email.toLowerCase());
          const docSnap = await docRef.get();

          if (docSnap.exists) {
            const userData = docSnap.data();
            if (userData.status !== 'active') {
              alert('Naka-pending pa ang iyong account. Hinihintay pa ang approval at role assignment ng Head Office Admin.');
              logoutUser();
              return;
            }
            const activeUser = {
              email: email,
              name: userData.name || displayName,
              role: userData.role || 'branch',
              branch: userData.branch || 'Branch ATC',
              status: userData.status,
              requiresPasswordSetup: fromGoogle && !userData.hasPasswordSet
            };
            setCurrentUser(activeUser);
            redirectToRoleDashboard(activeUser.role);
          } else {
            await docRef.set({
              email: email,
              name: displayName,
              role: 'pending',
              status: 'pending',
              hasPasswordSet: !fromGoogle,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert('Matagumpay na na-authenticate ang iyong Google Account! Dahil bago ito, naka-set bilang PENDING. Paki-abiso si Admin para ma-activate.');
            logoutUser();
          }
        } catch (err) {
          console.error(err);
          alert('Database error: ' + err.message);
        }
      }
    }

    async function handleRegister() {
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-password').value;
      const station = document.getElementById('reg-station').value.trim();

      if (!name || !email || !pass || !station) {
        alert('Mangyaring punan ang lahat ng field.');
        return;
      }

      if (auth && auth.createUserWithEmailAndPassword && firebaseConfig.apiKey !== "AIzaSyYOUR_ACTUAL_FIREBASE_API_KEY") {
        try {
          await auth.createUserWithEmailAndPassword(email, pass);
          if (db) {
            await db.collection('users').doc(email.toLowerCase()).set({
              name: name,
              email: email,
              requestedStation: station,
              role: 'pending',
              status: 'pending',
              hasPasswordSet: true,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
          alert('Narehistro na ang account! Maghintay sa approval ni Admin bago makapasok (Status: PENDING).');
          toggleAuthForm(false);
        } catch (err) {
          alert('Registration Error: ' + err.message);
        }
      } else {
        alert('Narehistro na ang account! Maghintay sa approval ni Admin bago makapasok (Status: PENDING).');
        toggleAuthForm(false);
      }
    }
  </script>
</body>
</html>
