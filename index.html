<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordering Portal - Login</title>

    <!-- Prevent browser back redirect to GitHub -->
    <script>
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };
    </script>
    
    <!-- Firebase SDK (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 36px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header h2 {
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-header p {
            color: #65676b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.15);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .forgot-link {
            color: #1877f2;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .btn-primary {
            background-color: #1877f2;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #166fe5;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: #8a8d91;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dadde1;
        }

        .divider span {
            padding: 0 12px;
        }

        .btn-google {
            background-color: #ffffff;
            color: #3c4043;
            border: 1px solid #dadce0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            background-color: #f8f9fa;
            border-color: #c6c9cc;
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>Ordering System</h2>
            <p>Mag-login sa iyong account</p>
        </div>

        <form id="emailLoginForm">
            <div class="form-group">
                <label for="emailInput">Email Address</label>
                <input type="email" id="emailInput" placeholder="pangalan@domain.com" required>
            </div>

            <div class="form-group">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" placeholder="••••••••" required>
            </div>

            <div class="form-actions">
                <a class="forgot-link" id="forgotPasswordLink">Nakalimutan ang password?</a>
            </div>

            <button type="submit" class="btn btn-primary">Mag-login</button>
        </form>

        <div class="divider">
            <span>o magpatuloy gamit ang</span>
        </div>

        <button type="button" class="btn btn-google" id="googleLoginBtn">
            <svg viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Mag-login gamit ang Google
        </button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBNUNZOcFBbaxTgG4oINS6WUZj_PVLCWtk",
          authDomain: "ordering-kenji.firebaseapp.com",
          projectId: "ordering-kenji",
          storageBucket: "ordering-kenji.firebasestorage.app",
          messagingSenderId: "22937850065",
          appId: "1:22937850065:web:978cdd85eae967ed6eb5f0",
          measurementId: "G-WD8ZGRBRXN"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Email at Password Login
        document.getElementById('emailLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    alert("Hindi makapasok: " + error.message);
                });
        });

        // Google Sign-in
        document.getElementById('googleLoginBtn').addEventListener('click', function() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(() => {
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    alert("Hindi makapasok: " + error.message);
                });
        });

        // Forgot Password Prompt
        document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
            e.preventDefault();
            const email = prompt("Ilagay ang iyong rehistradong Email Address:");
            if (email) {
                auth.sendPasswordResetEmail(email.trim())
                    .then(() => {
                        alert("Naipadala na ang password reset link sa iyong email.");
                    })
                    .catch((error) => {
                        alert("Error: " + error.message);
                    });
            }
        });
    </script>
</body>
</html>
