<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KusinaERP - Enterprise Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a;">

  <div class="card" style="max-width: 440px; width: 100%; margin: 1rem; padding: 2rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="color: #1e293b; font-size: 1.5rem;">🍳 KusinaERP Enterprise</h2>
      <p style="color: #64748b; font-size: 0.85rem;">Secured Enterprise Portal (Firebase Auth & Firestore)</p>
    </div>

    <!-- Alert / Status Banner -->
    <div id="auth-status-msg" style="display: none; padding: 0.75rem; border-radius: 0.375rem; font-size: 0.8rem; margin-bottom: 1rem;"></div>

    <!-- Google Sign-In Button (Explicitly type="button") -->
    <button type="button" id="btn-google-login" class="btn btn-google" style="width: 100%; margin-bottom: 1rem;" onclick="handleGoogleSignIn(event)">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
      </svg>
      Sign in with Google Account
    </button>

    <div class="divider">O GAMITIN ANG EMAIL AT PASSWORD</div>

    <!-- Email/Password Section -->
    <div id="login-section">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="user@company.com" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="button" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" onclick="handleEmailLogin(event)">Sign In with Email</button>
      
      <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #64748b;">
        Wala pang account? <a href="javascript:void(0)" style="color: #2563eb; font-weight: 600;" onclick="toggleAuthForm(true)">Mag-register dito</a>
      </p>
    </div>

    <!-- Self-Registration Form -->
    <div id="register-section" style="display: none;">
      <div class="form-group">
        <label>Buong Pangalan</label>
        <input type="text" id="reg-name" placeholder="Juan Dela Cruz">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email" placeholder="juan@company.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>Requested Station / Branch</label>
        <input type="text" id="reg-station" placeholder="Hal: Branch ATC o Commissary A">
      </div>
      <button type="button" class="btn btn-success" style="width: 100%; margin-top: 0.5rem;" onclick="handleRegister(event)">Submit Registration</button>
      
      <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #64748b;">
        May account na? <a href="javascript:void(0)" style="color: #2563eb; font-weight: 600;" onclick="toggleAuthForm(false)">Bumalik sa Login</a>
      </p>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    function showStatus(msg, isError = true) {
      const el = document.getElementById('auth-status-msg');
      el.style.display = 'block';
      el.style.background = isError ? '#fee2e2' : '#dcfce7';
      el.style.color = isError ? '#991b1b' : '#166534';
      el.style.border = isError ? '1px solid #f87171' : '1px solid #86efac';
      el.innerHTML = msg;
    }

    // Check redirect login results (for mobile devices where popups fail)
    window.addEventListener('load', async () => {
      if (auth && auth.getRedirectResult) {
        try {
          const result = await auth.getRedirectResult();
          if (result && result.user) {
            showStatus('Na-verify ang Google login, kinukuha ang role...', false);
            await processUserSession(result.user.email, result.user.displayName || result.user.email, true);
          }
        } catch (err) {
          console.error('Redirect result error:', err);
          showStatus('Error sa redirect login: ' + err.message, true);
        }
      }
    });

    function toggleAuthForm(showRegister) {
      document.getElementById('login-section').style.display = showRegister ? 'none' : 'block';
      document.getElementById('register-section').style.display = showRegister ? 'block' : 'none';
      document.getElementById('auth-status-msg').style.display = 'none';
    }

    async function handleGoogleSignIn(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      if (!auth || !googleProvider) {
        showStatus('<b>Pansin:</b> Hindi na-load ang Firebase. Pakisuri ang network o CDN scripts.');
        return;
      }

      if (typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey.includes('YOUR_ACTUAL_FIREBASE')) {
        showStatus('<b>Kailangan ng Setup:</b> Naka-placeholder pa ang Firebase API key sa <code>firebase-config.js</code>. Ilagay ang totoong config mula sa Firebase Console para gumana ang Google Login.');
        return;
      }

      showStatus('Binubuksan ang Google authentication...', false);

      try {
        const result = await auth.signInWithPopup(googleProvider);
        if (result && result.user) {
          showStatus('Tagumpay! Sinusuri ang role sa database...', false);
          await processUserSession(result.user.email, result.user.displayName || result.user.email, true);
        }
      } catch (err) {
        console.error('Google Sign-In Error:', err);
        
        if (err.code === 'auth/popup-blocked') {
          showStatus('Naka-block ang pop-up window sa browser mo. Sinusubukang mag-redirect...');
          try {
            await auth.signInWithRedirect(googleProvider);
          } catch (redErr) {
            showStatus('Nabigo ang redirect: ' + redErr.message);
          }
        } else if (err.code === 'auth/unauthorized-domain') {
          const currentHost = window.location.hostname;
          showStatus(`<b>Unauthorized Domain:</b> Ang domain na <code>${currentHost}</code> ay hindi pa naka-whitelist.<br><br>Pumunta sa <b>Firebase Console</b> &rarr; <b>Authentication</b> &rarr; <b>Settings</b> &rarr; <b>Authorized domains</b> at idagdag ang: <code>${currentHost}</code>`);
        } else if (err.code === 'auth/cancelled-popup-request' || err.code === 'auth/popup-closed-by-user') {
          showStatus('Kinansela ang Google login window.');
        } else {
          showStatus('Error sa Google login: ' + err.message);
        }
      }
    }

    async function handleEmailLogin(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;

      if (!email || !pass) {
        showStatus('Mangyaring ilagay ang iyong email at password.');
        return;
      }

      if (auth && auth.signInWithEmailAndPassword && !firebaseConfig.apiKey.includes('YOUR_ACTUAL_FIREBASE')) {
        showStatus('Nagla-log in...', false);
        try {
          const userCred = await auth.signInWithEmailAndPassword(email, pass);
          await processUserSession(userCred.user.email, userCred.user.displayName || email, false);
        } catch (err) {
          showStatus('Login Failed: ' + err.message);
        }
      } else {
        // Fallback for immediate offline testing
        let role = 'branch';
        let branch = 'Branch ATC';
        let status = 'active';

        if (email.toLowerCase().includes('admin')) {
          role = 'admin';
          branch = 'Head Office';
        } else if (email.toLowerCase().includes('commissary_b') || email.toLowerCase().includes('commi-b')) {
          role = 'commissary_b';
          branch = 'Commissary B (Vegetables & Wares)';
        } else if (email.toLowerCase().includes('commissary') || email.toLowerCase().includes('commi')) {
          role = 'commissary_a';
          branch = 'Commissary A (Meat Division)';
        }

        const userObj = {
          email: email,
          name: email.split('@')[0],
          role: role,
          branch: branch,
          status: status,
          requiresPasswordSetup: false
        };
        setCurrentUser(userObj);
        redirectToRoleDashboard(role);
      }
    }

    async function processUserSession(email, displayName, fromGoogle) {
      if (db) {
        try {
          const docRef = db.collection('users').doc(email.toLowerCase());
          const docSnap = await docRef.get();

          if (docSnap.exists) {
            const userData = docSnap.data();
            if (userData.status !== 'active') {
              showStatus('<b>Pending Account:</b> Hinihintay pa ang pag-apruba at pag-assign ng Role ng Head Office Admin bago ka makapasok.');
              logoutUser();
              return;
            }
            const activeUser = {
              email: email,
              name: userData.name || displayName,
              role: userData.role || 'branch',
              branch: userData.branch || 'Branch ATC',
              status: userData.status,
              requiresPasswordSetup: fromGoogle && !userData.hasPasswordSet
            };
            setCurrentUser(activeUser);
            redirectToRoleDashboard(activeUser.role);
          } else {
            await docRef.set({
              email: email,
              name: displayName,
              role: 'pending',
              status: 'pending',
              hasPasswordSet: !fromGoogle,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            showStatus('<b>Bagong Rehistro:</b> Na-save ang account bilang PENDING. Paki-abiso ang Admin para ma-activate at mabigyan ng Branch role bago makapasok.');
            logoutUser();
          }
        } catch (err) {
          console.error(err);
          showStatus('Firestore Error: ' + err.message);
        }
      } else {
        // Direct local routing if firestore not reachable
        const fallbackUser = {
          email: email,
          name: displayName,
          role: 'branch',
          branch: 'Branch ATC',
          status: 'active',
          requiresPasswordSetup: false
        };
        setCurrentUser(fallbackUser);
        redirectToRoleDashboard(fallbackUser.role);
      }
    }

    async function handleRegister(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-password').value;
      const station = document.getElementById('reg-station').value.trim();

      if (!name || !email || !pass || !station) {
        showStatus('Mangyaring punan ang lahat ng field.');
        return;
      }

      if (auth && auth.createUserWithEmailAndPassword && !firebaseConfig.apiKey.includes('YOUR_ACTUAL_FIREBASE')) {
        try {
          await auth.createUserWithEmailAndPassword(email, pass);
          if (db) {
            await db.collection('users').doc(email.toLowerCase()).set({
              name: name,
              email: email,
              requestedStation: station,
              role: 'pending',
              status: 'pending',
              hasPasswordSet: true,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
          showStatus('Narehistro na ang account! Maghintay sa approval ni Admin (Status: PENDING).', false);
          toggleAuthForm(false);
        } catch (err) {
          showStatus('Registration Error: ' + err.message);
        }
      } else {
        showStatus('Narehistro na ang account! Maghintay sa approval ni Admin (Status: PENDING).', false);
        toggleAuthForm(false);
      }
    }
  </script>
</body>
</html>
