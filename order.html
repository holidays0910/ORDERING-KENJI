<!DOCTYPE html>
<html lang="fil"><head>
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mag-order</title>
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--card:#fff;--bd:#e2e8f0;--pri:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#f1f5f9;--card:#1e293b;--bd:#334155}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);padding:.7rem 1rem;z-index:5}
h1{font-size:1.1rem;margin:0}small{color:#64748b}
.cats{display:flex;gap:.4rem;overflow:auto;padding:.5rem 1rem}.cats button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:2rem;padding:.4rem .9rem}.cats button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.it{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--bd);border-radius:.7rem;margin:.4rem 1rem;padding:.7rem}.it b{flex:1}
.q{display:flex;align-items:center;gap:.5rem}.q button{width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:1.2rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:.7rem 1rem}
.go{width:100%;padding:.9rem;border:0;border-radius:.7rem;background:var(--pri);color:#fff;font-size:1.05rem;font-weight:700}.go:disabled{opacity:.5}
input{width:calc(100% - 2rem);margin:.3rem 1rem;padding:.7rem;border:1px solid var(--bd);border-radius:.5rem;background:var(--card);color:var(--fg);font-size:16px}
.msg{margin:2rem 1rem;text-align:center;font-size:1.1rem}
</style></head><body>
<header><h1 id="ttl">Menu</h1><small id="sub"></small></header>
<div id="app"><div class="msg">Nilo-load…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const Q=new URLSearchParams(location.search),CO=Q.get('c')||'',SI=Q.get('s')||'',TB=Q.get('t')||'';let M=null,cart={},cat='',sent=false;
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function key(){return (CO+'__'+SI).replace(/[\/\s]/g,'_')}
async function init(){
 const A=document.getElementById('app');
 try{if(!CO||!SI||!TB)throw new Error('Maling QR code.');const d=await db.collection('pos_pubmenu').doc(key()).get();if(!d.exists)throw new Error('Hindi pa bukas ang QR ordering.');M=d.data();
  if(M.open===false){A.innerHTML='<div class="msg">Sarado ang QR ordering ngayon. Pakitawag ang waiter. 🙏</div>';return}
  const tn=(M.tables||{})[TB];if(!tn)throw new Error('Hindi nakilala ang table.');
  document.getElementById('ttl').textContent=(M.siteName||'Menu')+' — '+tn;document.getElementById('sub').textContent='Pumili ng order, tapos pindutin ang "Ipadala"';cat=(M.items[0]||{}).category||'';draw();
 }catch(e){A.innerHTML='<div class="msg">'+E(e.message)+'</div>'}}
function draw(){
 const A=document.getElementById('app'),cats=[...new Set(M.items.map(i=>i.category||'Iba pa'))],n=Object.values(cart).reduce((s,x)=>s+x,0),tot=M.items.reduce((s,i)=>s+(cart[i.id]||0)*i.price,0);
 A.innerHTML='<div class="cats">'+cats.map(c=>'<button class="'+(c===cat?'on':'')+'" data-c="'+E(c)+'">'+E(c)+'</button>').join('')+'</div>'+
 M.items.filter(i=>(i.category||'Iba pa')===(cat||cats[0])).map(i=>'<div class="it"><b>'+E(i.name)+'<br><small>₱'+i.price.toLocaleString()+'</small></b><div class="q"><button data-m="'+E(i.id)+'">−</button><span>'+(cart[i.id]||0)+'</span><button data-p="'+E(i.id)+'">+</button></div></div>').join('')+
 '<input id="nm" placeholder="Pangalan (opsyonal)" maxlength="40"><input id="nt" placeholder="Tala (hal. walang sibuyas)" maxlength="120"><div class="bar"><button class="go" id="go" '+(n?'':'disabled')+'>Ipadala ang order · '+n+' item · ₱'+tot.toLocaleString()+'</button></div>';
 A.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw()});A.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cart[b.dataset.p]=(cart[b.dataset.p]||0)+1;keep();draw()});A.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const k=b.dataset.m;if(cart[k]>1)cart[k]--;else delete cart[k];keep();draw()});document.getElementById('go').onclick=send;
 const nm=document.getElementById('nm'),nt=document.getElementById('nt');nm.value=window._nm||'';nt.value=window._nt||'';nm.oninput=()=>window._nm=nm.value;nt.oninput=()=>window._nt=nt.value}
function keep(){}
async function send(){
 if(sent)return;const items=M.items.filter(i=>cart[i.id]).map(i=>({id:i.id,name:i.name,price:i.price,qty:cart[i.id]}));if(!items.length)return;
 const b=document.getElementById('go');b.disabled=true;b.textContent='Ipinapadala…';
 try{await db.collection('pos_qr_orders').add({company:CO,site:SI,tableId:TB,tableName:(M.tables||{})[TB]||'',items,custName:String(window._nm||'').slice(0,40),note:String(window._nt||'').slice(0,120),status:'new',createdAt:new Date().toISOString()});sent=true;cart={};
  document.getElementById('app').innerHTML='<div class="msg">✅ Naipadala na ang order!<br><small>Hintayin ang waiter para sa kumpirmasyon.</small><br><br><button class="go" style="max-width:300px" onclick="sent=false;draw()">Mag-order ulit</button></div>'}
 catch(e){b.disabled=false;b.textContent='Hindi naipadala — subukan ulit'}}
init();
</script></body></html>
