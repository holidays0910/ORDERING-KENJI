<!DOCTYPE html>
<html lang="fil"><head>
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mag-order</title>
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--card:#fff;--bd:#e2e8f0;--pri:#16a34a;--mut:#64748b}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#f1f5f9;--card:#1e293b;--bd:#334155;--mut:#94a3b8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding-bottom:96px}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);padding:.7rem 1rem;z-index:5}
h1{font-size:1.1rem;margin:0}small{color:var(--mut)}
.cats{display:flex;gap:.4rem;overflow:auto;padding:.5rem 1rem;position:sticky;top:54px;background:var(--bg);z-index:4}.cats button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:2rem;padding:.4rem .9rem}.cats button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.it{display:flex;align-items:center;gap:.7rem;background:var(--card);border:1px solid var(--bd);border-radius:.8rem;margin:.45rem 1rem;padding:.6rem;cursor:pointer}
.ph{width:68px;height:68px;border-radius:.6rem;background:var(--bd);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.it .nm{flex:1;min-width:0}.it .nm b{display:block}.it .add{width:2.3rem;height:2.3rem;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:1.4rem;flex:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:.7rem 1rem;z-index:6}
.go{width:100%;padding:.9rem;border:0;border-radius:.7rem;background:var(--pri);color:#fff;font-size:1.05rem;font-weight:700}.go:disabled{opacity:.5}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:.8rem;margin:.5rem 1rem;padding:.7rem}
input,textarea{width:100%;margin:.3rem 0;padding:.7rem;border:1px solid var(--bd);border-radius:.5rem;background:var(--card);color:var(--fg);font-size:16px;font-family:inherit}
.msg{margin:2rem 1rem;text-align:center;font-size:1.1rem}
.sheet{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:var(--card);width:100%;max-width:520px;border-radius:1rem 1rem 0 0;padding:1rem;max-height:85vh;overflow:auto}
.row{display:flex;align-items:center;gap:.5rem;padding:.35rem 0}.row .sp{flex:1}.qb{display:flex;align-items:center;gap:.5rem}.qb button{width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:1.2rem}
.pill{display:inline-block;border-radius:1rem;padding:.1rem .6rem;font-size:.8rem;background:#fef3c7;color:#92400e}
</style></head><body>
<header><h1 id="ttl">Menu</h1><small id="sub"></small></header>
<div id="app"><div class="msg">Nilo-load…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* Customer self-order. Walang login. Ang customer ay sumusulat LAMANG ng maliit na 'new' na order (id:qty:tinanggal) —
   ang presyo ay HINDI galing dito; ang staff ang magkukumpirma at kukuha ng tamang presyo sa sariling menu. */
const Q=new URLSearchParams(location.search),PK=Q.get('p')||'',TB=Q.get('t')||'',TK=Q.get('k')||'';
let M=null,cart=[],cat='',pics={},LK='kq_last_'+PK,poll=null;
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2});
const okImg=s=>/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(s||'')&&s.length<90000;
const LS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const A=()=>document.getElementById('app');
async function init(){
 try{if(!PK||!TB||!TK)throw new Error('Maling QR code. Pakitawag ang waiter.');
  const d=await db.collection('pos_pubmenu').doc(PK).get();if(!d.exists)throw new Error('Hindi pa bukas ang QR ordering.');M=d.data();
  if(M.open===false){A().innerHTML='<div class="msg">Sarado ang QR ordering ngayon. Pakitawag ang waiter. 🙏</div>';return}
  const tn=(M.tables||{})[TB];if(!tn)throw new Error('Hindi nakilala ang table.');
  document.getElementById('ttl').textContent=(M.siteName||'Menu')+' — '+tn;document.getElementById('sub').textContent='Pumili ng order, tapos pindutin ang "Ipadala"';
  cat=((M.items||[])[0]||{}).category||'';
  const last=LS.g(LK);if(last){try{const j=JSON.parse(last);if(j.t===TB&&Date.now()-j.at<6*3600e3){track(j.id);return}}catch(e){}}
  draw()
 }catch(e){A().innerHTML='<div class="msg">'+E(e.message)+'</div>'}}
const cats=()=>[...new Set((M.items||[]).map(i=>i.category||'Iba pa'))];
const lineKey=l=>l.id+'|'+l.xo.join(',');
const item=id=>(M.items||[]).find(i=>i.id===id);
const cutOf=(i,xo)=>(i.rm||[]).filter(r=>xo.includes(r.k)).reduce((s,r)=>s+(+r.c||0),0);
const unit=l=>{const i=item(l.id);return Math.max(0,(+i.price||0)-cutOf(i,l.xo))};
const total=()=>cart.reduce((s,l)=>s+unit(l)*l.qty,0);
async function loadPics(list){await Promise.all(list.filter(i=>i.ph&&!(i.id in pics)).map(async i=>{pics[i.id]='';try{const d=await db.collection('pos_pubpic').doc(PK+'__'+i.id).get();if(d.exists&&okImg(d.data().d))pics[i.id]=d.data().d}catch(e){}}))}
async function draw(){
 const cs=cats();if(!cat||!cs.includes(cat))cat=cs[0]||'';const L=(M.items||[]).filter(i=>(i.category||'Iba pa')===cat);
 const n=cart.reduce((s,l)=>s+l.qty,0);
 A().innerHTML='<div class="cats">'+cs.map(c=>'<button class="'+(c===cat?'on':'')+'" data-c="'+E(c)+'">'+E(c)+'</button>').join('')+'</div>'+
 L.map(i=>'<div class="it" data-i="'+E(i.id)+'"><div class="ph" id="ph_'+E(i.id)+'">'+(okImg(pics[i.id])?'':'🍽️')+'</div><div class="nm"><b>'+E(i.name)+'</b><small>'+P(i.price)+((i.rm||[]).length?' · ✂️ puwedeng tanggalin ang sangkap':'')+'</small></div><button class="add" aria-label="Idagdag">+</button></div>').join('')+
 (L.length?'':'<div class="msg">Walang item.</div>')+
 '<div class="bar"><button class="go" id="go" '+(n?'':'disabled')+'>'+(n?'🛒 Tingnan ang order ('+n+') · '+P(total()):'Pumili muna ng order')+'</button></div>';
 A().querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw()});
 A().querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>pick(b.dataset.i));
 document.getElementById('go').onclick=review;
 await loadPics(L);L.forEach(i=>{const e=document.getElementById('ph_'+i.id);if(e&&okImg(pics[i.id])){const im=document.createElement('img');im.className='ph';im.alt='';im.src=pics[i.id];e.replaceWith(im)}})}
function pick(id){const i=item(id);if(!i)return;const st={xo:[],qty:1};
 if(!(i.rm||[]).length){add(i,[],1);return}
 const sh=document.createElement('div');sh.className='sheet';document.body.appendChild(sh);
 const r=()=>{sh.innerHTML='<div><h3 style="margin:.2rem 0">'+E(i.name)+'</h3><small>Lagyan ng ✔ ang sangkap na AYAW mo. Bababa ang presyo kung may bawas.</small>'+
  i.rm.map(x=>'<label class="row"><input type="checkbox" data-k="'+E(x.k)+'" '+(st.xo.includes(x.k)?'checked':'')+' style="width:auto;margin:0"><span class="sp">Walang '+E(x.n)+'</span>'+(+x.c>0?'<small style="color:#16a34a">−'+P(x.c)+'</small>':'<small>(walang bawas)</small>')+'</label>').join('')+
  '<div class="row"><span class="sp"><b>Dami</b></span><div class="qb"><button id="m1">−</button><b>'+st.qty+'</b><button id="p1">+</button></div></div>'+
  '<button class="go" id="ok" style="margin-top:.6rem">Idagdag · '+P(Math.max(0,i.price-cutOf(i,st.xo))*st.qty)+'</button><button class="go" id="cx" style="margin-top:.4rem;background:var(--bd);color:var(--fg)">Kanselahin</button></div>';
  sh.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{const k=c.dataset.k;st.xo=c.checked?[...st.xo,k]:st.xo.filter(x=>x!==k);r()});
  sh.querySelector('#m1').onclick=()=>{st.qty=Math.max(1,st.qty-1);r()};sh.querySelector('#p1').onclick=()=>{st.qty=Math.min(20,st.qty+1);r()};
  sh.querySelector('#ok').onclick=()=>{add(i,st.xo,st.qty);sh.remove()};sh.querySelector('#cx').onclick=()=>sh.remove()};r()}
function add(i,xo,q){xo=[...xo].sort();const k=i.id+'|'+xo.join(',');const l=cart.find(x=>lineKey(x)===k);if(l)l.qty=Math.min(20,l.qty+q);else cart.push({id:i.id,xo,qty:q});draw()}
function review(){
 const sh=document.createElement('div');sh.className='sheet';document.body.appendChild(sh);
 const r=()=>{if(!cart.length){sh.remove();draw();return}
  sh.innerHTML='<div><h3 style="margin:.2rem 0">🛒 Ang order mo</h3>'+cart.map((l,ix)=>{const i=item(l.id),xs=(i.rm||[]).filter(x=>l.xo.includes(x.k)).map(x=>x.n);return '<div class="row"><div class="sp"><b>'+E(i.name)+'</b>'+(xs.length?'<br><small>✂️ Walang '+E(xs.join(', '))+'</small>':'')+'<br><small>'+P(unit(l))+'</small></div><div class="qb"><button data-m="'+ix+'">−</button><b>'+l.qty+'</b><button data-p="'+ix+'">+</button></div></div>'}).join('')+
  '<div class="row"><span class="sp"><b>Tantiya ng total</b></span><b>'+P(total())+'</b></div><small>Ang cashier ang magkukumpirma ng huling presyo.</small>'+
  '<input id="nm" placeholder="Pangalan (opsyonal)" maxlength="40" value="'+E(window._nm||'')+'"><input id="nt" placeholder="Tala (hal. mabilis po, walang yelo)" maxlength="120" value="'+E(window._nt||'')+'">'+
  '<button class="go" id="send" style="margin-top:.5rem">📤 Ipadala ang order</button><button class="go" id="cx" style="margin-top:.4rem;background:var(--bd);color:var(--fg)">← Dagdag pa</button></div>';
  sh.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const l=cart[+b.dataset.m];l.qty--;if(l.qty<=0)cart.splice(+b.dataset.m,1);r()});
  sh.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const l=cart[+b.dataset.p];l.qty=Math.min(20,l.qty+1);r()});
  sh.querySelector('#nm').oninput=e=>window._nm=e.target.value;sh.querySelector('#nt').oninput=e=>window._nt=e.target.value;
  sh.querySelector('#cx').onclick=()=>{sh.remove();draw()};sh.querySelector('#send').onclick=()=>send(sh)};r()}
const rid=()=>{const a=new Uint8Array(12);(crypto||window.msCrypto).getRandomValues(a);return Array.from(a,x=>x.toString(36).padStart(2,'0')).join('').slice(0,20).padEnd(20,'x')};
async function send(sh){
 const b=sh.querySelector('#send');const wait=Math.ceil((20000-(Date.now()-(+LS.g('kq_cd')||0)))/1000);if(wait>0){b.textContent='Sandali — maghintay ng '+wait+' seg';return}
 const it=cart.slice(0,40).map(l=>encodeURIComponent(l.id)+':'+l.qty+':'+l.xo.map(encodeURIComponent).join(',')).join('|');if(!it||it.length>1400){b.textContent='Masyadong marami — hatiin sa dalawang order';return}
 b.disabled=true;b.textContent='Ipinapadala…';const id=rid();
 try{await db.collection('pos_qr_orders').doc(id).set({company:M.company||'',site:M.site||'',pk:PK,tableId:TB,tableName:String((M.tables||{})[TB]||'').slice(0,40),tok:TK,it,custName:String(window._nm||'').slice(0,40),note:String(window._nt||'').slice(0,120),status:'new',createdAt:new Date().toISOString()});
  LS.s('kq_cd',String(Date.now()));LS.s(LK,JSON.stringify({id,t:TB,at:Date.now()}));cart=[];window._nt='';sh.remove();track(id)}
 catch(e){b.disabled=false;b.textContent=/permission/i.test(e.message)?'Hindi tinanggap ng sistema (sarado o maling QR). Tawagin ang waiter.':'Hindi naipadala — subukan ulit'}}
function track(id){clearInterval(poll);
 const show=d=>{const s=(d&&d.status)||'new';
  if(s==='accepted'){A().innerHTML='<div class="msg">✅ <b>Tinanggap na ang order mo!</b><br>Inihahanda na ng kusina'+(d.orderNo?' (Order #'+E(d.orderNo)+')':'')+'.<br><br><button class="go" style="max-width:300px" id="again">Mag-order ulit</button></div>';clearInterval(poll)}
  else if(s==='rejected'){A().innerHTML='<div class="msg">❌ <b>Hindi natanggap ang order.</b><br>'+E(d.reason||'Pakitawag ang waiter.')+'<br><br><button class="go" style="max-width:300px" id="again">Mag-order ulit</button></div>';clearInterval(poll)}
  else A().innerHTML='<div class="msg">📨 <b>Naipadala na ang order mo.</b><br>⏳ Hinihintay ang kumpirmasyon ng cashier/waiter…<br><small>Hindi pa ito pumapasok sa kusina hangga’t hindi tinatanggap.</small><br><br><button class="go" style="max-width:300px;background:var(--bd);color:var(--fg)" id="again">Dagdag na order</button></div>';
  const ag=document.getElementById('again');if(ag)ag.onclick=()=>{LS.s(LK,'');clearInterval(poll);draw()}};
 const tick=async()=>{try{const d=await db.collection('pos_qr_orders').doc(id).get();if(d.exists)show(d.data())}catch(e){}};show({status:'new'});tick();poll=setInterval(tick,5000)}
init();
</script></body></html>
