<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        .role-section { display: none; }
    </style>
</head>
<body>
    <h2 id="welcomeText">Loading...</h2>
    <button id="logoutBtn" style="display:none;">Logout</button>

    <!-- Admin Section -->
    <div id="adminSection" class="role-section">
        <h3>Admin Dashboard</h3>
        <p>List of Users (Example UI):</p>
        <ul>
            <li>user1@gmail.com - <button onclick="sendResetLink('user1@gmail.com')">Send Reset Link</button> <button>Force Logout</button></li>
        </ul>
    </div>

    <!-- Branch Section -->
    <div id="branchSection" class="role-section">
        <h3>Branch Dashboard</h3>
        <p>Your Branch Code: <span id="branchCodeDisplay"></span></p>
        <button>Add Items to Cart</button>
        <button style="background: green; color: white;">Place Order</button>
    </div>

    <!-- Commissary A Section -->
    <div id="commissaryASection" class="role-section">
        <h3>Commissary A Dashboard</h3>
    </div>

    <!-- Commissary B Section -->
    <div id="commissaryBSection" class="role-section">
        <h3>Commissary B Dashboard</h3>
    </div>

    <script>
        // Firebase Configuration (Na-update mula sa iyong image at code)
        const firebaseConfig = {
          apiKey: "AIzaSyBNUNZOcFBbaxTgG4oINS6WUZj_PVLCWtk",
          authDomain: "ordering-kenji.firebaseapp.com",
          projectId: "ordering-kenji",
          storageBucket: "ordering-kenji.firebasestorage.app",
          messagingSenderId: "22937850065",
          appId: "1:22937850065:web:978cdd85eae967ed6eb5f0",
          measurementId: "G-WD8ZGRBRXN"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 5-Minute Inactivity Auto-Logout
        let inactivityTime = function () {
            let time;
            window.onload = resetTimer;
            document.onmousemove = resetTimer;
            document.onkeypress = resetTimer;

            function logout() {
                alert("5 minuto kang walang activity. Kusa kang na-logout para sa security.");
                auth.signOut();
            }

            function resetTimer() {
                clearTimeout(time);
                time = setTimeout(logout, 300000); // 5 minutes in milliseconds
            }
        };
        inactivityTime();

        // Check Auth and Roles
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('logoutBtn').style.display = 'inline-block';
                
                const userRef = db.collection("accounts").doc(user.uid);
                
                userRef.get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        
                        if(data.status === "block") {
                            alert("Ang account mo ay naka-block.");
                            auth.signOut();
                            return;
                        } else if (data.status === "inactive") {
                            alert("Ang account mo ay inactive.");
                            auth.signOut();
                            return;
                        }

                        document.getElementById('welcomeText').innerText = "Welcome, " + user.email;

                        if (data.role === "admin") {
                            document.getElementById('adminSection').style.display = 'block';
                        } else if (data.role === "branch") {
                            document.getElementById('branchSection').style.display = 'block';
                            document.getElementById('branchCodeDisplay').innerText = data.branchCode || "N/A";
                        } else if (data.role === "commissaryA") {
                            document.getElementById('commissaryASection').style.display = 'block';
                        } else if (data.role === "commissaryB") {
                            document.getElementById('commissaryBSection').style.display = 'block';
                        }
                    } else {
                        // First time login - Setup as Branch
                        const branchCode = prompt("Unang login! Ilagay ang iyong Branch Code (hal. SO3, GB5, ATC, TOK, TAN):");
                        if(branchCode) {
                            userRef.set({
                                email: user.email,
                                role: "branch",
                                status: "active",
                                branchCode: branchCode.toUpperCase()
                            }).then(() => {
                                alert("Na-save na ang iyong Branch Code. Welcome!");
                                window.location.reload();
                            });
                        } else {
                            alert("Kailangan ang Branch Code para makapasok.");
                            auth.signOut();
                        }
                    }
                }).catch((error) => console.error(error));
            } else {
                window.location.href = "index.html";
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

        // Admin Send Reset Link Function
        function sendResetLink(email) {
            auth.sendPasswordResetEmail(email).then(() => {
                alert("Password reset link sent to " + email);
            }).catch((error) => {
                alert("Error: " + error.message);
            });
        }
    </script>
</body>
</html>
