<!DOCTYPE html>
<html lang="fil"><head>
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Exam / Survey</title>
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--card:#fff;--bd:#e2e8f0;--pri:#2563eb;--mut:#64748b}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#f1f5f9;--card:#1e293b;--bd:#334155;--mut:#94a3b8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);padding:.7rem 1rem;z-index:5;display:flex;align-items:center;gap:.6rem}
h1{font-size:1.05rem;margin:0;flex:1}#tm{font-weight:700;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--bd);border-radius:.8rem;margin:.7rem auto;padding:.9rem;max-width:720px;width:calc(100% - 1.4rem)}
textarea{min-height:120px}input,textarea{width:100%;margin:.3rem 0 .6rem;padding:.7rem;border:1px solid var(--bd);border-radius:.5rem;background:var(--card);color:var(--fg);font-size:16px;font-family:inherit}
.opt{display:flex;gap:.6rem;align-items:flex-start;border:1px solid var(--bd);border-radius:.6rem;padding:.65rem;margin:.4rem 0;cursor:pointer}.opt.on{border-color:var(--pri);background:#2563eb18}
.opt b{width:1.4rem;flex:none}.go{width:100%;padding:.9rem;border:0;border-radius:.7rem;background:var(--pri);color:#fff;font-size:1.05rem;font-weight:700}.go:disabled{opacity:.5}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:.7rem 1rem;z-index:6}.bar>div{max-width:720px;margin:auto}
.dot{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:.4rem;min-width:1.9rem;height:1.9rem;margin:0 .1rem}.dot.on{background:var(--pri);color:#fff;border-color:var(--pri)}.msg{margin:2.5rem 1rem;text-align:center;font-size:1.1rem}small{color:var(--mut)}
</style></head><body>
<header><h1 id="ttl">Exam</h1><span id="tm"></span></header>
<div id="app"><div class="msg">Nilo-load…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* Public na exam/survey ng HR. Walang login. Ang tamang sagot ay HINDI nandito (nasa HR lang) — HR ang nag-i-score. */
const EID = new URLSearchParams(location.search).get('e') || '', LK = 'ex_done_' + EID;
const E = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = { g: k => { try { return localStorage.getItem(k) } catch (e) { return null } }, s: (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} } };
const A = () => document.getElementById('app'), L = i => String.fromCharCode(65 + i);
let X = null, ANS = {}, ANS0 = null, ESS = {}, T0 = 0, left = 0, tmr = null, sent = false, PAGES = [], PG = 0, ROUND = 0, FLAG = [];
function msg(t) { A().innerHTML = '<div class="msg">' + t + '</div>'; }
const hh = (e, q, i) => { let a = 0xdeadbeef, b = 0x41c6ce57; const t = e + ':' + q + ':' + i; for (let k = 0; k < t.length; k++) { const c = t.charCodeAt(k); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); } a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909); b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909); return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36); };
async function init() {
  try {
    if (!EID) throw new Error('Maling link.');
    if (LS.g(LK)) { msg('✅ Naisumite mo na ang sagot mo dito. Salamat!'); return; }
    const d = await db.collection('hr_exams').doc(EID).get(); if (!d.exists) throw new Error('Hindi nakita ang exam.');
    X = d.data(); document.getElementById('ttl').textContent = X.title; document.title = X.title;
    if (X.status !== 'open') throw new Error('Sarado na ang exam / survey na ito.');
    A().innerHTML = `<div class="card"><h2 style="margin-top:0">${E(X.title)}</h2>${X.intro ? '<div style="white-space:pre-wrap;background:#fffbeb;color:#1f2937;border:1px solid #fcd34d;border-radius:.6rem;padding:.7rem;margin:.5rem 0"><b>📋 Instruksyon</b>\n' + E(X.intro) + '</div>' : ''}<small>${(X.qs || []).filter(q => q.k !== 'text').length} tanong${X.timeMin ? ' · ' + X.timeMin + ' minuto — magsisimula ang oras pagpindot ng “Simulan”' : ''}</small>
    <label>Buong pangalan *<input id="nm" maxlength="80" autocomplete="name"></label><label>Contact (mobile / email)<input id="ct" maxlength="80"></label><label>Posisyon na ina-apply-an<input id="ps" maxlength="80"></label>
    <button class="go" onclick="start()">▶ Simulan</button></div>`;
  } catch (e) { msg(E(e.message)); }
}
function paginate() { const per = Math.max(1, X.perPage || 5); PAGES = []; let cur = [], n = 0; (X.qs || []).forEach(q => { cur.push(q); if (q.k !== 'text' && ++n % per === 0) { PAGES.push(cur); cur = []; } }); if (cur.some(q => q.k !== 'text') || !PAGES.length) PAGES.push(cur); else if (cur.length) PAGES[PAGES.length - 1] = PAGES[PAGES.length - 1].concat(cur); }
function start() {
  const nm = document.getElementById('nm').value.trim(); if (nm.length < 2) { alert('Ilagay ang pangalan mo.'); return; }
  X._p = { name: nm, contact: document.getElementById('ct').value.trim(), position: document.getElementById('ps').value.trim() };
  T0 = Date.now(); if (X.timeMin) { left = X.timeMin * 60; tick(); tmr = setInterval(tick, 1000); }
  paginate(); PG = 0; draw();
}
function tick() { left--; const m = Math.max(0, left); document.getElementById('tm').textContent = '⏱ ' + Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); if (left <= 0) { clearInterval(tmr); submit(true); } }
const real = () => (X.qs || []).filter(q => q.k !== 'text');
const answered = () => real().filter(q => q.k === 'essay' ? String(ESS[q.id] || '').trim() : ANS[q.id] !== undefined).length;
const numOf = id => real().findIndex(q => q.id === id) + 1;
function cnt() { const e = document.getElementById('pg'); if (e) e.textContent = answered() + '/' + real().length + ' nasagot'; }
function draw() {
  const pg = PAGES[PG] || [], last = PG === PAGES.length - 1;
  A().innerHTML = (PAGES.length > 1 ? `<div class="card" style="padding:.5rem .9rem"><small>Page ${PG + 1} ng ${PAGES.length}</small> ${PAGES.map((p, i) => `<button class="dot ${i === PG ? 'on' : ''}" onclick="go(${i})">${i + 1}</button>`).join('')}</div>` : '') +
   (FLAG.length ? `<div class="card" style="background:#eff6ff;color:#1e3a8a;border-color:#93c5fd">🔎 Mga tanong na iminumungkahing balikan: <b>${FLAG.map(f => '#' + numOf(f)).join(', ')}</b>. Puwede mong palitan ang sagot o iwanan kung sigurado ka.</div>` : '') +
   pg.map(q => { if (q.k === 'text') return `<div class="card" style="background:#fffbeb;color:#1f2937;border-color:#fcd34d;white-space:pre-wrap">${E(q.q)}</div>`; const n = numOf(q.id), fl = FLAG.includes(q.id);
    if (q.k === 'essay') return `<div class="card" ${fl ? 'style="border-color:#3b82f6"' : ''}><b>${n}. ${E(q.q)}</b><textarea id="es-${q.id}" maxlength="3000" placeholder="I-type ang sagot mo dito…" oninput="ESS['${q.id}']=this.value;cnt()">${E(ESS[q.id] || '')}</textarea></div>`;
    return `<div class="card" ${fl ? 'style="border-color:#3b82f6"' : ''}><b>${n}. ${E(q.q)}</b>${fl ? ' <span class="pill">🔎 suriin ulit</span>' : ''}${q.opts.map((o, j) => `<div class="opt ${ANS[q.id] === j ? 'on' : ''}" onclick="pick('${q.id}',${j})"><b>${L(j)}</b><span>${E(o)}</span></div>`).join('')}</div>`; }).join('') +
   `<div class="bar"><div><small id="pg">${answered()}/${real().length} nasagot</small><div style="display:flex;gap:.5rem"><button class="go" style="background:#64748b" ${PG ? '' : 'disabled'} onclick="go(${PG - 1})">◀ Balik</button>${last ? '<button class="go" id="sb" onclick="finish()">✅ Tapos na</button>' : `<button class="go" onclick="go(${PG + 1})">Susunod ▶</button>`}</div></div></div>`;
}
function go(i) { if (sent || i < 0 || i >= PAGES.length) return; PG = i; draw(); window.scrollTo(0, 0); }
function pick(q, j) { if (sent) return; ANS[q] = j; const y = window.scrollY; draw(); window.scrollTo(0, y); }
function dlg(html, btns) { return new Promise(res => { const o = document.createElement('div'); o.className = 'sheet'; o.innerHTML = `<div style="padding:1rem">${html}<div style="display:flex;gap:.5rem;margin-top:.8rem">${btns.map((b, i) => `<button class="go" style="${i ? 'background:#64748b' : ''}" data-i="${i}">${b}</button>`).join('')}</div></div>`; o.onclick = e => { const b = e.target.closest('button'); if (b) { o.remove(); res(+b.dataset.i); } }; document.body.appendChild(o); }); }
function suspects() { if (X.type === 'survey' || X.review === false || !X.chk) return []; return real().filter(q => q.k !== 'essay' && X.chk[q.id] && (ANS[q.id] === undefined || hh(EID, q.id, ANS[q.id]) !== X.chk[q.id])).map(q => q.id); }
async function finish() {
  if (sent) return; if (!ANS0) ANS0 = JSON.parse(JSON.stringify(ANS));
  const sus = suspects();
  if (sus.length && ROUND < 2) {
    const nums = sus.map(id => '#' + numOf(id)).join(', ');
    const c = await dlg(`<h3 style="margin:0 0 .4rem">🔎 Gusto mo bang i-review ang mga sagot mo?</h3><p style="margin:0">Mungkahi ng system na balikan ang <b>${sus.length}</b> tanong: <b>${nums}</b>${ROUND ? ' (huling pagkakataon)' : ''}. Hindi sinasabi ng system kung tama o mali ang mga ito — puwede mo itong suriin ulit at palitan ang sagot.</p>`, ['🔎 Oo, i-review ko', 'Hindi, isumite na']);
    if (c === 0) { ROUND++; FLAG = sus; const pi = PAGES.findIndex(p => p.some(q => q.id === sus[0])); PG = pi < 0 ? 0 : pi; draw(); window.scrollTo(0, 0); return; }
  } else if (!sus.length && ROUND === 0 && answered() < real().length) {
    if ((await dlg('<h3 style="margin:0 0 .4rem">Hindi pa tapos</h3><p style="margin:0">' + (real().length - answered()) + ' tanong ang wala pang sagot. Isumite pa rin?</p>', ['Isumite', 'Balik'])) === 1) return;
  }
  submit(false);
}
async function submit(auto) {
  if (sent) return; sent = true; clearInterval(tmr); const sb = document.getElementById('sb'); if (sb) sb.disabled = true;
  try {
    const id = Array.from({ length: 24 }, () => 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)]).join(''), d = { exam: EID, name: X._p.name, contact: X._p.contact, position: X._p.position, ans: ANS, ess: Object.fromEntries(Object.entries(ESS).filter(e => String(e[1]).trim())), secs: Math.round((Date.now() - T0) / 1000), submittedAt: new Date().toISOString() };
    if (ANS0) d.ans0 = ANS0; if (ROUND) d.rev = ROUND;
    await db.collection('hr_exam_results').doc(id).set(d);
    LS.s(LK, '1'); document.getElementById('tm').textContent = ''; msg((auto ? '⏰ Tapos na ang oras. ' : '') + '✅ Naisumite na ang sagot mo. Salamat, ' + E(X._p.name) + '! Makikipag-ugnayan sa iyo ang HR.');
  } catch (e) { sent = false; if (sb) sb.disabled = false; alert('Hindi naisumite: ' + e.message + '\nSubukan ulit.'); }
}
init();
</script></body></html>
